[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "material-maker-mcp-host"
version = "0.3.1"
description = "Typed MCP server for the Material Maker localhost bridge"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["mcp>=1.26,<2"]

[project.optional-dependencies]
dev = ["pytest>=8.4", "ruff>=0.12"]

[project.scripts]
material-maker-mcp = "material_maker_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/material_maker_mcp"]

[tool.hatch.build.targets.sdist]
include = [
  "src/",
  "tests/",
  "scripts/",
  "README.md",
  "pyproject.toml",
  "uv.lock",
  "start-material-maker.ps1",
  "addons/",
  "docs/",
  "LICENSE",
  "UPSTREAM-LICENSE.md",
  "THIRD_PARTY_NOTICES.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
